name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug + tests + APK size budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + run unit tests
        run: ./gradlew --no-daemon assembleDebug test

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Enforce APK size budget
        run: bash scripts/check-apk-size.sh

      - name: Verify GitHub Actions workflow shape
        run: bash scripts/check-workflow.sh