name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # for gh release create + git push
  actions: read

jobs:
  release:
    name: Build release APK + attach to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + run unit tests
        run: ./gradlew --no-daemon assembleDebug test

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Enforce APK size budget
        run: bash scripts/check-apk-size.sh

      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-pro-minimax-player-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Use the canonical `gh` CLI instead of softprops/action-gh-release@v2
        # — softprops ran with exit 0 but did not actually create the release
        # on the first attempt (silent no-op on branch triggers). The CLI is
        # pre-installed on ubuntu-latest runners and gives clear errors.
        run: |
          set -euo pipefail
          TAG="cherry-player-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Cherry Player ${GITHUB_SHA::7}" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.
          Run: [Actions run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          APK size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)" \
            --target "${GITHUB_SHA}"