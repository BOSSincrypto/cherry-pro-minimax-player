name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # for softprops/action-gh-release
  actions: read

jobs:
  release:
    name: Build release APK + attach to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + run unit tests
        run: ./gradlew --no-daemon assembleDebug test

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Enforce APK size budget
        run: bash scripts/check-apk-size.sh

      - name: Upload release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-pro-minimax-player-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # softprops/action-gh-release requires an explicit tag when the
          # workflow trigger isn't tag-based (we trigger on push to main).
          # Using the SHA guarantees a unique release per build.
          tag_name: cherry-player-${{ github.sha }}
          name: cherry-pro-minimax-player ${{ github.sha }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}